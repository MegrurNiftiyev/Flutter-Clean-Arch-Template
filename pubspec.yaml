name: flutter_clean_arch_template
description: "A robust, scalable starter template for Flutter applications built following Clean Architecture principles."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Routing
  flutter_svg: ^2.0.17
  font_awesome_flutter: ^10.8.0
  skeletonizer: ^1.4.3
  flutter_native_splash: ^2.4.4
  go_router: ^14.8.0
  flutter_screenutil: ^5.9.3

  # State Management
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.7


  # Dependency Injection
  get_it: ^8.0.3

  # Networking & Connectivity
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # Local Storage & Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Localization
  easy_localization: ^3.0.7

  # Flavors & Environment
  flutter_flavor: ^3.1.2
  flutter_dotenv: ^5.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_gen_runner: ^5.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/lang/
    - assets/animations/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true
